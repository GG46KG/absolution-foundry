name: Create Release on Tag

on:
  push:
    tags:
      - v**

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v3

    # The tag (v0.2.0) sets the version Foundry sees (0.2.0), so the two can't drift
    - name: Set version from tag
      run: |
        jq --arg version "${GITHUB_REF_NAME#v}" '.version = $version' system.json > system.tmp.json
        mv system.tmp.json system.json

    # Only the files Foundry needs, with their folders (-r); not src/, prototype/ or .github/
    - name: Zip files
      run: zip -r absolution.zip system.json module templates lang css assets packs LICENSE.txt README.md CHANGELOG.md

    - uses: ncipollo/release-action@v1
      with:
        artifacts: absolution.zip,system.json
        tag: ${{ github.ref_name }}
        # The manifest URL reads releases/latest, so each tagged release must
        # become latest even if an older tag (v1.2) has a higher number
        makeLatest: true
        allowUpdates: true
        omitDraftDuringUpdate: true
        omitPrereleaseDuringUpdate: true
