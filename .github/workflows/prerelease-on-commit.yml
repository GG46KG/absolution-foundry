name: Create Prerelease on Commit

on:
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v3

    - name: Move latest tag
      run: |
        git push origin :latest || true  # nothing to delete the first time
        git tag latest
        git push origin latest

    - name: Set zip name
      run: echo "ZIP_NAME=absolution_$(git rev-parse --short "$GITHUB_SHA")" >> $GITHUB_ENV

    # Only the files Foundry needs, with their folders (-r); not src/, prototype/ or .github/
    - name: Zip files
      run: zip -r ${{ env.ZIP_NAME }}.zip system.json module templates lang css assets packs LICENSE.txt README.md CHANGELOG.md

    - uses: ncipollo/release-action@v1
      with:
        artifacts: ${{ env.ZIP_NAME }}.zip,system.json
        prerelease: true
        tag: "latest"
        allowUpdates: true
        removeArtifacts: true # These are indexed to git SHA, so axe the previous ones
        omitDraftDuringUpdate: true
        omitPrereleaseDuringUpdate: true
